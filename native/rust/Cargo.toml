[package]
name = "effectcraft-hmos"
version = "0.24.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "effectcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
# 上游前端与引擎：path 依赖，上游文件零改动。EffectcraftApp 已把宿主缝直接暴露为
# new(Session) / logic / raw_input_hook / ui / on_exit（impl eframe::App），hooks 字段可直写。
effectcraft-ui-egui = { path = "../../../effectcraft/crates/ui-egui" }
effectcraft-engine = { path = "../../../effectcraft/crates/engine" }
effectcraft-host = { path = "../../../effectcraft/crates/host" }
# egui 0.37 / egui-wgpu 0.37：与 effectcraft 根 Cargo.toml 的 [patch] 同一 git fork rev，
# 否则跨边界 egui 类型全对不上。
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["capture"] }
# eframe：解析到本仓库 shim（[patch] 指向 ../eframe-ohos）。适配层用它驱动
# `impl eframe::App for EffectcraftApp`（raw_input_hook/logic/ui/on_exit）与最小 Frame。
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端。
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# [patch] 只对 workspace 根生效；本适配层是独立 workspace，必须把 effectcraft 根 Cargo.toml 的
# [patch.crates-io] 整段抄过来，再做两处 OHOS 定制：
#   1) eframe   → 本仓库 shim（不引入 winit；winit 在 OHOS compile_error!）
#   2) wgpu-hal → vendored 30.0.1 鸿蒙 GLES uniform-block 修补版（沿用 FilmCraft 已验证目录）
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "068e079c7be4b100a8a6b305b31ac881e069727e", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "068e079c7be4b100a8a6b305b31ac881e069727e", version = "=0.3.0" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { path = "../eframe-ohos" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
# winit 保留 fork（若图中出现则不致解析失败；配合 shim 后预期不进入编译图）。
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# wgpu-hal：鸿蒙 GLES 需 uniform-block 修补，沿用 FilmCraft 已验证的同一 30.0.1 目录。
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }
# boa_engine：其 crate-type 含 cdylib，会在目标侧额外链 .so 而失败（OHOS NDK 不吃 rustc
# 注入的 GNU-ld 参数）。已把 crate-type 收敛为 rlib-only 的本地副本 patch 进来（见 third_party）。
boa_engine = { path = "../../third_party/boa_engine-0.22.0" }

# EffectCraft 依赖图含大量编解码 crate（isobmff/avi/matroska/hevc/…），release .a 极大。
# thin LTO + codegen-units=1 显著压缩体积，且保留全部 FFI 符号。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
